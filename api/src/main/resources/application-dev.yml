spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:postgresql://localhost:5678/database
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  batch:
    job:
      enabled: true
      name: financialProductSyncJob
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO

collector:
  enabled: true
  # ONTONG = 수동 정부 정책상품(manual-products.json) 동기화. 온통청년 API 폐기로 FetchManualRawTasklet이 원천.
  # FSS(은행 공시)까지 함께 돌리려면 ALL 로 변경.
  source: ALL
  mode: SYNC
  # REQ-001 상품명 후행 괄호 제거 재정규화를 위해 27 -> 28. (PR #20이 27로 올린 것 위에 얹음)
  normalizer-version: 28
  reader-page-size : 500
  unseen-disable-period : 1

  ontong-youth:
    base-url: https://www.youthcenter.go.kr
    api-key: ${ONTONG_YOUTH_API_KEY:}
    page-size : 100

  fss:
    base-url: https://finlife.fss.or.kr
    api-key: ${FSS_API_KEY:}
    page-size : 100

  llm:
    enabled: ${LLM_ENABLED:false}
    provider: GEMINI
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    prompt-version: 7
    schema-version: 15
    chunk-size: ${LLM_CHUNK_SIZE:10}
    max-concurrency: ${LLM_MAX_CONCURRENCY:3}
    temperature: ${LLM_TEMPERATURE:0}
    base-url: https://generativelanguage.googleapis.com
    api-key: ${GEMINI_API_KEY:}
