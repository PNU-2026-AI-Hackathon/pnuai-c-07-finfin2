spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5678/database
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  batch:
    job:
      enabled: true
      name: financialProductSyncJob
    jdbc:
      initialize-schema: always

logging:
  level:
    root: INFO

collector:
  enabled: true
  source: FSS
  mode: SYNC
  normalizer-version: 18
  reader-page-size : 500
  unseen-disable-period : 1

  ontong-youth:
    base-url: https://www.youthcenter.go.kr
    api-key: ${ONTONG_YOUTH_API_KEY:}
    page-size : 100

  fss:
    base-url: https://finlife.fss.or.kr
    api-key: ${FSS_API_KEY:}
    page-size : 100

  llm:
    enabled: ${LLM_ENABLED:false}
    provider: GEMINI
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    prompt-version: 3
    schema-version: 11
    chunk-size: ${LLM_CHUNK_SIZE:10}
    max-concurrency: ${LLM_MAX_CONCURRENCY:3}
    temperature: ${LLM_TEMPERATURE:0}
    base-url: https://generativelanguage.googleapis.com
    api-key: ${GEMINI_API_KEY:}
